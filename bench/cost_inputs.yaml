# Inputs of the cost-per-task model (src/teardown/cost.py).
#
# Three kinds of input, kept apart on purpose:
#   price_tables  USD per million tokens. Three come from the repositories (each with the file that defines it);
#                 one is a hypothetical scenario defined here and labelled as such.
#   measurements  numbers read from a results or data file of a repository at its pinned commit
#                 (bench/manifest.yaml). `python -m teardown verify-sources` re-reads every one of them.
#   assumptions   numbers no repository measures. Each states why the value was chosen.
#
# JSON pointers follow RFC 6901 ("/" inside a key is written "~1").

price_tables:
  - id: gateway-illustrative
    label: Gateway illustrative table
    kind: repo
    description: >-
      The dated, illustrative three-tier table of semantic-cache-gateway (first model of each tier). Round numbers in
      the range public price lists use for small, mid-size and frontier models; not a quote from any provider.
    source:
      repo: semantic-cache-gateway
      path: src/cache_gateway/data/default_config.yaml
      contains:
        - "input_per_mtok: 0.10"
        - "output_per_mtok: 0.40"
        - "input_per_mtok: 0.60"
        - "output_per_mtok: 2.40"
        - "input_per_mtok: 3.00"
        - "output_per_mtok: 15.00"
    tiers:
      small: {input: 0.10, output: 0.40}
      medium: {input: 0.60, output: 2.40}
      large: {input: 3.00, output: 15.00}

  - id: gateway-narrow
    label: Gateway narrow table
    kind: repo
    description: >-
      The gateway benchmark's second table, where the large tier costs only about 4x the small tier on output. It shows
      how much of any routing saving is the price gap rather than the router.
    source:
      repo: semantic-cache-gateway
      path: src/cache_gateway/bench.py
      contains:
        - "prices = {Tier.SMALL: (1.0, 4.0), Tier.MEDIUM: (1.5, 6.0), Tier.LARGE: (3.0, 15.0)}"
    tiers:
      small: {input: 1.0, output: 4.0}
      medium: {input: 1.5, output: 6.0}
      large: {input: 3.0, output: 15.0}

  - id: trajectory-flat
    label: Trajectory-gate flat table
    kind: repo
    description: >-
      The single illustrative price of a small hosted model used by trajectory-eval-gate's example agent. Every tier
      costs the same, so routing has no effect under this table.
    source:
      repo: trajectory-eval-gate
      path: src/trajectory_gate/example/agent.py
      contains:
        - "PRICE_IN_PER_MTOK = 0.50"
        - "PRICE_OUT_PER_MTOK = 1.50"
    tiers:
      small: {input: 0.50, output: 1.50}
      medium: {input: 0.50, output: 1.50}
      large: {input: 0.50, output: 1.50}

  - id: scenario-premium-large
    label: "Scenario: premium large tier"
    kind: scenario
    description: >-
      HYPOTHETICAL, defined in this repository only. The gateway's illustrative small and medium prices with a large
      tier five times more expensive (15/75), standing in for a reasoning-class model. It is a stress test of how
      much each task depends on its large-tier calls, not a quote.
    tiers:
      small: {input: 0.10, output: 0.40}
      medium: {input: 0.60, output: 2.40}
      large: {input: 15.00, output: 75.00}

