assumptions:
  # Support answer
  - {id: support.prompt_tokens, value: 3072, unit: tokens,
     rationale: "Prompt budget for one support answer: the smallest budget at which the context assembler kept every planted fact in its benchmark (measurement assembler.retention_at_3072)."}
  - {id: support.answer_tokens, value: 250, unit: tokens,
     rationale: "Mean answer length. The agentic RAG generator caps answers at max_tokens=500 (generate.py); half of the cap is assumed."}
  - {id: support.rewrite_input_tokens, value: 400, unit: tokens,
     rationale: "An LLM query rewrite sees the question, the grader's diagnosis and an instruction block; no repository measures it."}
  - {id: support.rewrite_output_tokens, value: 120, unit: tokens,
     rationale: "A few rewritten queries returned as JSON."}
  - {id: memory.llm_calls_per_session, value: 2, unit: calls,
     rationale: "With a key, consolidation runs an LLM summary and an LLM fact extraction; one consolidation per session is assumed."}
  - {id: memory.prompt_overhead_tokens, value: 400, unit: tokens,
     rationale: "Instructions and output schema around the flushed turns of a consolidation call."}
  - {id: memory.output_tokens, value: 150, unit: tokens, rationale: "A short summary or a JSON list of facts."}
  # Coding task
  - {id: swarm.system_prompt_tokens, value: 800, unit: tokens per call,
     rationale: "Role instructions plus the JSON schema of the expected artifact, which the offline payload estimate leaves out. Order of magnitude implied by agents/prompts.py, not measured."}
  - {id: swarm.output_share, value: 0.35, unit: share of payload tokens,
     rationale: "The swarm reports request + reply tokens as one number; replies (code, votes) are assumed to be 35% of it."}
  # Research workflow
  - {id: research.plan_input_tokens, value: 1200, unit: tokens, rationale: "Brief, instructions and the plan schema."}
  - {id: research.plan_output_tokens, value: 300, unit: tokens, rationale: "A handful of research questions."}
  - {id: research.draft_input_tokens, value: 8192, unit: tokens,
     rationale: "Draft prompt filled to the largest budget of the context assembler's sweep (8,192), where its fact retention is 100%."}
  - {id: research.draft_output_tokens, value: 1200, unit: tokens, rationale: "A one-page brief."}
  # Pull-request gate
  - {id: gate.cases, value: 5, unit: cases,
     rationale: "The travel-desk suite has five cases (trajectory-eval-gate benchmark setup)."}
  - {id: gate.candidate_runs_per_case, value: 3, unit: runs,
     rationale: "Runs per case for each pull request, as in the trajectory-eval-gate benchmark (benchmark.json /setup/candidate_run_set)."}
  - {id: gate.baseline_runs_per_case, value: 20, unit: runs,
     rationale: "Baseline runs per case, as in the trajectory-eval-gate benchmark."}
  - {id: gate.prs_per_baseline, value: 20, unit: pull requests,
     rationale: "The baseline is re-recorded once every 20 merged pull requests, so its cost is spread over 20."}
  - {id: gate.judge_input_tokens, value: 900, unit: tokens,
     rationale: "Only for the optional LLM judge: rubric, facts and the final reply."}
  - {id: gate.judge_output_tokens, value: 150, unit: tokens, rationale: "A JSON verdict with a short rationale."}
