# Pinned benchmark manifest for the eleven systems in this teardown.
#
# `python -m teardown bench` reads this file, clones each repository at `commit` into a temporary directory,
# installs it into a fresh virtual environment, runs the chosen mode's commands and compares the headline numbers it
# produces with the ones committed at that commit.
#
# Conventions
#   commands       run from the clone's root; a leading `python`/`pip` uses the fresh venv's interpreter
#   env            extra environment variables for install and benchmark commands
#   needs_models   the mode downloads model weights (embeddings, cross-encoders, spaCy pipelines)
#   needs_data     the mode downloads a public dataset
#   deterministic  re-running the full mode should give the committed headline numbers exactly
#                  (timings excepted; they are never used as headline checks)
#   headline       values read from the fresh result files and from the committed ones at `commit`

version: 1
owner: iamsammy-ak
repos:
  - name: context-assembler-engine
    title: Context Assembler Engine
    summary: Fits every prompt to a verified token budget and explains every cut.
    commit: 1f7863ceab66f865fa5e69ff1d0806df8ed260fb
    published: true
    install: ['python -m pip install -e ".[dev]"']
    env: {PYTHONPATH: src}
    downloads: [tiktoken o200k_base encoding (about 4 MB, first use)]
    deterministic: true
    modes:
      full:
        commands: [python benchmarks/run_benchmark.py]
        runtime_minutes: 5
      fast:
        commands: ["python benchmarks/run_benchmark.py --seeds 5 --budgets 1024,3072"]
        runtime_minutes: 1
    results: [benchmarks/results/benchmark.json, benchmarks/results/benchmark.md]
    headline:
      - {label: "fact retention, engine (%)", file: benchmarks/results/benchmark.json, pointer: /overall/engine/fact_retention_pct}
      - {label: "budget violations, engine", file: benchmarks/results/benchmark.json, pointer: /overall/engine/violations}
      - {label: "fact retention, fixed split (%)", file: benchmarks/results/benchmark.json, pointer: /overall/proportional/fact_retention_pct}

  - name: graphrag-knowledge-pipeline
    title: GraphRAG Knowledge Pipeline
    summary: Builds a cited knowledge graph from text and answers multi-hop questions by walking it.
    commit: 21dc6d17dbd5fbc6ef827b8963c6a746f644b96e
    published: true
    install: ['python -m pip install -e ".[dev]"', python -m spacy download en_core_web_sm]
    env: {}
    downloads: [spaCy en_core_web_sm (about 13 MB)]
    deterministic: true
    modes:
      full:
        install: ['python -m pip install -e ".[dev,models]"', python -m spacy download en_core_web_sm]
        commands: [graphrag bench --embedder bge --chart assets/benchmark.png]
        runtime_minutes: 5
        needs_models: true
        results: [benchmarks/results/benchmark-bge-small-en-v1.5.json, benchmarks/results/benchmark-bge-small-en-v1.5.md]
        headline:
          - {label: "full support@5, graph (test)", file: benchmarks/results/benchmark-bge-small-en-v1.5.json, pointer: /retrieval/summary/test/graph/full@5}
          - {label: "full support@5, vector (test)", file: benchmarks/results/benchmark-bge-small-en-v1.5.json, pointer: /retrieval/summary/test/vector/full@5}
      fast:
        commands: [graphrag bench --embedder hashing]
        runtime_minutes: 2
        needs_models: true
        matches_committed: true
        results: [benchmarks/results/benchmark-hashing-512.json, benchmarks/results/benchmark-hashing-512.md]
        headline:
          - {label: "full support@5, graph (test)", file: benchmarks/results/benchmark-hashing-512.json, pointer: /retrieval/summary/test/graph/full@5}
          - {label: "full support@5, vector (test)", file: benchmarks/results/benchmark-hashing-512.json, pointer: /retrieval/summary/test/vector/full@5}

