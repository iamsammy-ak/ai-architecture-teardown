          - {label: "wrong answers, naive (share)", file: benchmarks/results/benchmark-hashing.json, pointer: /test/naive/wrong_answer_rate}

  - name: durable-agent-state-machine
    title: Durable Agent State Machine
    summary: Journal-backed workflow runtime that survives killed workers and publishes side effects once.
    commit: 5facc0f0b769a2e68a57b8601f0730d9f8d4382f
    published: true
    install: ['python -m pip install -e ".[dev]"']
    env: {PYTHONPATH: src}
    deterministic: false
    modes:
      full:
        commands:
          - python benchmarks/chaos_bench.py --runs 200 --crashes 200 --workers 8 --seed 7 --lease-ttl 1
          - python benchmarks/overhead.py
        runtime_minutes: 10
      fast:
        commands: [python benchmarks/chaos_bench.py --runs 12 --crashes 6 --workers 2 --seed 7 --lease-ttl 1]
        runtime_minutes: 2
        results: [benchmarks/results/chaos.json, benchmarks/results/chaos.md]
    results: [benchmarks/results/chaos.json, benchmarks/results/chaos.md, benchmarks/results/overhead.json, benchmarks/results/overhead.md]
    headline:
      - {label: "runs ending as expected (share)", file: benchmarks/results/chaos.json, pointer: /outbox/completion_rate}
      - {label: "duplicate publications, outbox", file: benchmarks/results/chaos.json, pointer: /outbox/duplicate_publications}
      - {label: "duplicate publications, direct call", file: benchmarks/results/chaos.json, pointer: /direct/duplicate_publications}
      - {label: "completed steps executed again", file: benchmarks/results/chaos.json, pointer: /outbox/completed_step_reexecutions}

