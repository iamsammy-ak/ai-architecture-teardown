[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-architecture-teardown"
version = "0.1.0"
description = "A public teardown of eleven AI-engineering systems: reference architecture, ADRs, cost-per-task model and a reproducible benchmark runner."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["llm", "agents", "architecture", "adr", "cost-model", "benchmarks", "mkdocs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "pymdown-extensions>=10.8"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "matplotlib>=3.7",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.8",
]

[project.scripts]
teardown = "teardown.cli:main"

[project.urls]
Homepage = "https://iamsammy-ak.github.io/ai-architecture-teardown/"
Source = "https://github.com/iamsammy-ak/ai-architecture-teardown"
Issues = "https://github.com/iamsammy-ak/ai-architecture-teardown/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/teardown"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "docs: builds the MkDocs site (needs mkdocs-material)",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
